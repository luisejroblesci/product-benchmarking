version: 2.1

parameters:
  models:
    type: string
    default: ""          # comma-separated model ids from bench.config.json; empty = all enabled
  conditions:
    type: string
    default: "cli+skills,cli,mcp+skills,mcp"
  cases:
    type: string
    default: ""          # empty = every case in the suite
  reps:
    type: integer
    default: 3

jobs:
  usecases-benchmark:
    docker:
      - image: cimg/node:22.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install circleci CLI
          command: |
            curl -1sLf 'https://packages.circleci.com/public/setup.deb.sh' | sudo -E bash
            sudo apt-get install -y circleci
            circleci version
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run use-cases benchmark
          no_output_timeout: 60m
          command: |
            args=(--reps << pipeline.parameters.reps >> --conditions "<< pipeline.parameters.conditions >>" --no-ui)
            [ -n "<< pipeline.parameters.models >>" ] && args+=(--models "<< pipeline.parameters.models >>")
            [ -n "<< pipeline.parameters.cases >>" ] && args+=(--cases "<< pipeline.parameters.cases >>")
            npx tsx src/cli.ts usecases "${args[@]}"
          # Provider keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, GOOGLE_GENERATIVE_AI_API_KEY, OPENROUTER_API_KEY)
          # and CIRCLECI_TOKEN come from project env vars or a context.
      - store_artifacts:
          path: benchmarks/uc2
          destination: benchmark-results

workflows:
  benchmark:
    jobs:
      - usecases-benchmark
